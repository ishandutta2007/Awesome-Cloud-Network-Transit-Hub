<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{r:38px;opacity:.3}}@keyframes float1{0%{transform:translateY(0)}}@keyframes float2{0%{transform:translateY(0)}}@keyframes float3{0%{transform:translateY(0)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.flow-line{stroke-dasharray:12 8;animation:dash 25s linear infinite}.hub-pulse{animation:pulse 3s ease-in-out infinite alternate}.float-spoke-1{animation:float1 6s ease-in-out infinite alternate}.float-spoke-2{animation:float2 7s ease-in-out infinite alternate}.float-spoke-3{animation:float3 8s ease-in-out infinite alternate}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1196" height="356" x="2" y="2" fill="none" stroke="#30363d" stroke-width="2" rx="14"/><g stroke="#fff" stroke-opacity=".03" stroke-width="1"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="600" x2="60