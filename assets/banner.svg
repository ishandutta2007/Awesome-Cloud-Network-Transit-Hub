<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }

    /* Animated Transit Flow Lines */
    .flow-line {
      stroke-dasharray: 12 8;
      animation: dash 25s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }

    /* Pulse animation for Transit Hub Node */
    .hub-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 38px; opacity: 0.3; }
      100% { r: 52px; opacity: 0.8; }
    }

    /* Floating nodes animation */
    .float-spoke-1 { animation: float1 6s ease-in-out infinite alternate; }
    .float-spoke-2 { animation: float2 7s ease-in-out infinite alternate; }
    .float-spoke-3 { animation: float3 8s ease-in-out infinite alternate; }

    @keyframes float1 { 0% { transform: translateY(0px); } 100% { transform: translateY(-8px); } }
    @keyframes float2 { 0% { transform: translateY(0px); } 100% { transform: translateY(10px); } }
    @keyframes float3 { 0% { transform: translateY(0px); } 100% { transform: translateY(-12px); } }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Dynamic Network Transit Topology Graphics (Positioned on the Right Side to Avoid Text Overlay) -->
  <g transform="translate(920, 180)">
    <!-- Central Hub Pulsing Aura -->
    <circle cx="0" cy="0" r="42" fill="#818cf8" class="hub-pulse" />
    
    <!-- Transit Lines to Spokes -->
    <line x1="0" y1="0" x2="-140" y2="-90" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" class="flow-line"/>
    <line x1="0" y1="0" x2="130" y2="-80" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.6" class="flow-line"/>
    <line x1="0" y1="0" x2="-120" y2="100" stroke="#c084fc" stroke-width="2.5" stroke-opacity="0.6" class="flow-line"/>
    <line x1="0" y1="0" x2="120" y2="90" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.6" class="flow-line"/>

    <!-- Central Transit Hub Core Node -->
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="3" filter="url(#glow)"/>
    <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">HUB</text>

    <!-- Spoke 1: AWS VPC -->
    <g transform="translate(-140, -90)" class="float-spoke-1">
      <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">AWS VPC</text>
    </g>

    <!-- Spoke 2: Azure VNet -->
    <g transform="translate(130, -80)" class="float-spoke-2">
      <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">Azure VNet</text>
    </g>

    <!-- Spoke 3: GCP VPC -->
    <g transform="translate(-120, 100)" class="float-spoke-3">
      <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">GCP VPC</text>
    </g>

    <!-- Spoke 4: On-Prem / SD-WAN -->
    <g transform="translate(120, 90)" class="float-spoke-1">
      <rect x="-50" y="-20" width="100" height="40" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">On-Prem HQ</text>
    </g>
  </g>

  <!-- Foreground Title and Content (Left Aligned for Clean Readability) -->
  <g transform="translate(70, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 65)">
      <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="6" fill="#38bdf8"/>
      <text x="32" y="21" class="badge-text">CLOUD NETWORK TRANSIT HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Cloud Network</text>
    <text x="0" y="195" class="title" fill="url(#accentGrad)">Transit Hub Ecosystem 🕸️</text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle">Curated directory of hyperscaler transit hubs, multi-cloud routers,</text>
    <text x="0" y="265" class="subtitle">open-source SONiC / VyOS gateways &amp; hub-and-spoke connectivity.</text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 295)">
      <rect width="115" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="57" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ Transitive Routing</text>

      <rect x="125" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="187" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">🌐 Multi-Cloud Peering</text>

      <rect x="260" y="0" width="125" height="26" rx="6" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4"/>
      <text x="322" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">🔒 Open-Source Gateways</text>
    </g>
  </g>
</svg>
